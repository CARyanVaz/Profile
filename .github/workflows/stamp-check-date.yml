# At midnight IST, moves the visible check date (News, Compliance calendar, GST updates, FAQ GST changes)
# to the new day. Runs only if the latest Daily compliance check finished successfully within the last
# 30 hours, and no calendar-update pull request is open (it would edit the same lines). See tools/stamp_checked.py.
name: Stamp date of latest check
on:
  schedule:
    - cron: "30 18 * * *"   # 12:00 midnight IST
  workflow_dispatch:
permissions:
  contents: write
  pages: write
  actions: read
  pull-requests: read
concurrency: stamp-check-date
jobs:
  stamp:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Stamp
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          last=$(gh run list --workflow daily-compliance-check.yml --status success --limit 1 --json updatedAt --jq '.[0].updatedAt')
          if [ -z "$last" ] || [ $(( $(date +%s) - $(date -d "$last" +%s) )) -gt 108000 ]; then
            echo "No successful daily check in the last 30 hours; not stamping."; exit 0
          fi
          n=$(gh pr list --state open --json headRefName --jq '[.[] | select(.headRefName | startswith("calendar-update-"))] | length')
          if [ "$n" != "0" ]; then echo "A calendar-update pull request is open; not stamping."; exit 0; fi
          python3 tools/stamp_checked.py
          python3 tools/check_site.py
          if git diff --quiet; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add -A news compliance-calendar faq services/gst-updates sitemap.xml tools/news.json tools/calendar.json
          git commit -m "Date of latest check moved to today"
          git push origin main
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
