# Keeps the site assistant's answers in step with the pages, including changes merged
# from the daily calendar and GST pull requests.
name: Rebuild assistant answers
on:
  push:
    branches: [main]
    paths: ["**/*.html", "sitemap.xml", "tools/build_chatbot.py"]
  workflow_dispatch:
permissions:
  contents: write
  pages: write
jobs:
  rebuild:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: python3 tools/build_chatbot.py
      - name: Commit if changed
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if git diff --quiet assets/data/chatbot.json; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898583+github-actions[bot]@users.noreply.github.com"
          git add assets/data/chatbot.json
          git commit -m "Rebuild assistant answers"
          git push
          gh api -X POST "repos/${GITHUB_REPOSITORY}/pages/builds" || true
